spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bookdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: devuser
    password: devpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          # Cognito User Pool의 OIDC discovery(.well-known/openid-configuration) → JWKS를 통해
          # Access Token 서명/만료를 자동 검증한다. 커스텀 디코더/시크릿 키를 두지 않는다.
          issuer-uri: https://cognito-idp.${cognito.region}.amazonaws.com/${cognito.user-pool-id}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# AWS Cognito 연동 설정: 실제 User Pool/App Client는 AWS 콘솔(또는 별도 IaC)에서 프로비저닝하며,
# 여기서는 환경변수로 값만 주입받는다. App Client에는 ALLOW_ADMIN_USER_PASSWORD_AUTH /
# ALLOW_REFRESH_TOKEN_AUTH Explicit Auth Flow가 활성화되어 있어야 하고,
# Refresh Token Rotation은 비활성 상태를 유지해야 한다(활성화 시 REFRESH_TOKEN_AUTH 플로우가 동작하지 않음).
cognito:
  region: ${AWS_COGNITO_REGION:ap-northeast-2}
  user-pool-id: ${AWS_COGNITO_USER_POOL_ID:}
  client-id: ${AWS_COGNITO_CLIENT_ID:}
  # App Client에 시크릿이 없는 "public" 클라이언트로 구성했다면 비워둔다.
  client-secret: ${AWS_COGNITO_CLIENT_SECRET:}

app:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
